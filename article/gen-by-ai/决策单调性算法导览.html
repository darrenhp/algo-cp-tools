<title>决策单调性与 DP 优化算法导览</title>

<style>
:root {
  --bg: #f6f7fb;
  --bg-panel: #ffffff;

  --border-soft: #edeff6;
  --accent: #4f46e5;
  --accent-soft: #eef0ff;
  --accent-2: #0f766e;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --danger: #be123c;
  --danger-soft: #ffe4e6;
  --ok: #15803d;
  --ok-soft: #dcfce7;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
  --radius: 12px;
  --mono: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
}

html[data-theme="dark"] {
  --bg: #0e1016;
  --bg-panel: #151823;
  --bg-soft: #1b1f2c;
  --bg-code: #0b0d13;
  --text: #e6e8f0;
  --text-soft: #a8adbe;
  --text-dim: #767c90;
  --border: #262b3a;
  --border-soft: #1f2432;
  --accent: #8b8cf9;
  --accent-soft: #1e2140;
  --accent-2: #2dd4bf;
  --warn: #fbbf24;
  --warn-soft: #3a2f14;
  --danger: #fb7185;
  --danger-soft: #3d1a24;
  --ok: #4ade80;
  --ok-soft: #12301f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);

* { box-sizing: border-box; }

html, body {

}

body {
  background: var(--bg);

a { color: var(--accent); text-decoration: none; }

.app { display: flex; min-height: 100vh; }

/* ---------- sidebar ---------- */
.sidebar {

.brand {

}

/* ---------- table ---------- */

</div>
<script>
/* ===== 分组定义 ===== */
const FAMILIES = [
  {
    id: "monge",
    name: "Ⅰ · 决策单调性与 Monge 矩阵族",
    desc: "核心：四边形不等式 ⟹ 决策点单调 ⟹ 不必枚举全部决策点。"
  },
  {
    id: "linear",
    name: "Ⅱ · 凸包与线性函数最值族",
    desc: "转移关于查询点呈线性，用凸壳 / 线段树维护直线集合。"
  },
  {
    id: "convex",
    name: "Ⅲ · 凸性与卷积族",
    desc: "依赖「答案对某个参数凸」或「序列凸」，砍掉状态的一维。"
  },
  {
    id: "appendix",
    name: "Ⅳ · 附录",
    desc: "性质层级、访问模型、选型决策树与资料索引。"
  }
];

/* ===== 算法数据 ===== */
const ALGOS = [

/* ---------- 1 ---------- */
{
  id: "monotone-minima",
  name: "Monotone Minima",
  en: "Divide-and-conquer row minima on a monotone matrix",
  family: "monge",
  tagline: "中点行暴力扫一遍，用它的最优列把矩阵切成两半递归。",
  props: ["Monotone（行最优列位置非降）"],
  access: ["随机访问", "移动访问"],
  mode: "离线",
  cx: "O((n+m) log m)",
  cxNote: "n 列、m 行。共 log m 层递归，每层扫描总长 O(n+m)。常见简写 O(m log n)。",
  cxTable: [
    { c: "标准（w 可 O(1) 取）", v: "O((n+m) log m)" },
    { c: "移动访问（双指针跳转）", v: "O((n+m) log m) 次 w 计算" }
  ],
  when: [
    "求单调矩阵每行（列）的最小值位置：1D/1D DP 的 <code>dp[i] = min_{j&lt;i}{dp[j] + w(j,i)}</code>（离线形态）。",
    "<b>成本函数只支持「移动访问」时</b>——即 <code>w(j,i)</code> 无法 O(1) 随机取，只能从当前格移到相邻格增量维护（莫队式双指针）。这是它压过 SMAWK 的杀手锏。",
    "<code>min_j{A_j + B_{i-j}}</code> 形态的卷积 / 合并类转移。",
    "作为更大算法的内层子程序：CDQ 分治里批量处理「左半 → 右半」的转移。"
  ],
  how: [
    "定义 <code>solve(l, r, L, R)</code>：计算第 <code>l..r</code> 行的最优列，且已知这些行的 opt 都落在 <code>[L,R]</code> 内。",
    "取中点行 <code>mid</code>，在 <code>[L,R]</code> 上暴力扫一遍得到 <code>opt(mid)</code>。",
    "由单调性：左半所有行的 opt ≤ opt(mid)，右半所有行的 opt ≥ opt(mid)。递归 <code>solve(l,mid-1,L,opt(mid))</code> 与 <code>solve(mid+1,r,opt(mid),R)</code>。",
    "每层递归中各子问题的扫描区间互不重叠（只在端点处重合），故每层总代价 O(n+m)。"
  ],
  code: `// A(row, col) 可 O(1) 计算，或由双指针增量维护
// 求 opt[0..m-1]：每行最小值所在的列
void solve(int l, int r, int L, int R) {
    if (l > r) return;
    int mid = (l + r) >> 1;
    pair<T, int> best = {INF, -1};
    for (int j = L; j <= R; ++j) {        // 暴力扫中点行
        T v = A(mid, j);                  // 移动访问时：把指针从上一位置跳到 (mid,j)
        if (v < best.first) best = {v, j};
    }
    opt[mid] = best.second;
    solve(l, mid - 1, L, best.second);
    solve(mid + 1, r, best.second, R);
}
// 调用：solve(0, m - 1, 0, n - 1)`,
  pitfalls: [
    "<b>只需 Monotone，不需要 Totally Monotone。</b>它比 SMAWK 的条件弱，但比 SMAWK 多一个 log。",
    "<b>tie-breaking 必须自洽</b>：决定取「最左最优列」还是「最右最优列」后，比较符号与递归方向要一致，否则单调性会被等号破坏。",
    "移动访问时，扫描顺序要规划好：向左右两个子递归跳指针的代价与区间长度相关，总跳转次数仍是 O((n+m) log m)。",
    "递归里 <code>[L,R]</code> 是<b>列</b>区间，<code>[l,r]</code> 是<b>行</b>区间，别写反。"
  ],
  problems: [
    "CF 868F Yet Another Minimization Problem —— 分治 + 莫队移动指针算 w，是「移动访问」的教科书用例",
    "任何 <code>dp[i][k] = min_j{dp[j][k-1] + C(j,i)}</code> 且 C 满足四边形不等式的分层 DP"
  ],
  refs: [
    { t: "OI Wiki · 四边形不等式优化", u: "https://oi-wiki.org/dp/opt/quadrangle/", d: "含分治 + 移动访问的完整讨论" },
    { t: "Jeff Erickson · Advanced Dynamic Programming", u: "https://jeffe.cs.illinois.edu/teaching/comptop/2017/notes/D-faster-dynprog.pdf", d: "TM / Monge 的定义与 D&C 界" }
  ]
},

/* ---------- 2 ---------- */
{
  id: "smawk",
  name: "SMAWK",
  en: "Aggarwal–Klawe–Moran–Shor–Wilber, 1987",
  family: "monge",
  tagline: "Reduce 删列 + Interpolate 插值，线性时间取完全单调矩阵的所有行最优。",
  props: ["Totally Monotone（TM）", "Monge ⟹ TM"],
  access: ["随机访问"],
  mode: "离线",
  cx: "O(m + n)",
  cxNote: "m 行 n 列。原始更精确的界是 O(m(1 + log(n/m)))，当行数远多于列数时比 O(m+n) 更强。",

// cmp(r, u, v): 在第 r 行，列 u 是否「不优于」列 v
vector<int> smawk(const vector<int>& row, const vector<int>& col, auto cmp) {
    int n = row.size();
    if (n == 0) return {};
    // ---- Reduce：栈式删列，剩余列数 <= n ----
    vector<int> c2;
    for (int c : col) {
        while (!c2.empty() && cmp(row[c2.size() - 1], c2.back(), c)) c2.pop_back();
        if ((int)c2.size() < n) c2.push_back(c);
    }
    // ---- Interpolate：只递归偶数行 ----
    vector<int> r2;
    for (int i = 1; i < n; i += 2) r2.push_back(row[i]);
    auto a2 = smawk(r2, c2, cmp);
    vector<int> ans(n);
    for (int i = 0; i < n; i += 2) ans[i] = a2[i >> 1];
    // ---- 奇数行：夹在相邻偶数行 opt 之间暴力填 ----
    for (int i = 1; i < n; i += 2) {
        int L = ans[i - 1], R = (i + 1 < n ? ans[i + 1] : c2.back());
        ans[i] = L;
        for (int c = L; c <= R; ++c) if (cmp(row[i], ans[i], c)) ans[i] = c;
    }
    return ans;
}`,

│   ├─ 斜率单调 / 可离线 ─────────────────────→ [[cht|Convex Hull Trick]]           O(n) ~ O(n log n)
│   ├─ 任意顺序插入，单点查询 ──────────────────→ [[li-chao|Li Chao 线段树]]           O(log C)
│   └─ 时间递增 + 区间最值 + 需在线修改 ────────→ [[kinetic-tournament|KTT]]         均摊 O(log²n)
│
├─ 有「恰好选 K 个」约束
│   ├─ 答案关于个数凸 ─────────────────────────→ [[aliens-trick|Aliens Trick / WQS]]  O(n log V)
│   └─ 第二维是凸的分段线性函数 ────────────────→ [[slope-trick|Slope Trick]]         O(n log n)

│   ├─ 离线 + 随机访问 ────────────────────────→ [[monotone-minima|Monotone Minima]]  O((n+m) log m)
│   │                                            [[smawk|SMAWK]]                  O(n + m)
│   ├─ 离线 + 移动访问 ────────────────────────→ [[dc-optimization|D&C + 莫队双指针]]       O(n log n)
│   ├─ 在线 + 随机访问 ────────────────────────→ [[binary-stack|二分栈]]               O(n log n)
│   │                                            [[larsch|LARSCH]]                O(n)
│   ├─ 在线 + 移动访问 ────────────────────────→ [[simplified-larsch|Simplified LARSCH]]   O(n log n)

│
├─ 区间 DP（最优搜索树），满足 QI + 区间单调 ───→ [[knuth-yao|Knuth-Yao]]              O(n²)

└─ 分层 DAG 最短路，边权 Monge ─────────────────→ [[monge-shortest-path|Monge 最短路]] + WQS`;

/* ================= 工具 ================= */
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const strip = (s) => String(s == null ? "" : s).replace(/<[^>]*>/g, "");

function hl(src) {
  const stash = [];
  let s = esc(src);
  s = s.replace(/\/\/[^\n]*/g, (m) => {
    stash.push('<span class="c">' + m + "</span>");
    return "@@STASH" + (stash.length - 1) + "@@";
  });
  s = s.replace(/"(?:[^"\\]|\\.)*"/g, (m) => {
    stash.push('<span class="s">' + m + "</span>");
    return "@@STASH" + (stash.length - 1) + "@@";
  });
  s = s.replace(/\b(int|long|void|bool|auto|const|struct|template|typename|class|for|while|if|else|return|pair|deque|vector|priority_queue|double|float|swap|size|push_back|pop_back|emplace_back|pop_front|push_front|using|namespace|include|new|delete)\b/g,
    '<span class="k">$1</span>');
  s = s.replace(/\b(\d+)\b/g, '<span class="n">$1</span>');
  s = s.replace(/@@STASH(\d+)@@/g, (m, i) => stash[+i]);
  return s;
}

function treeHTML(src) {
  return esc(src).replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g,
    (m, id, name) => `<a href="#/algo/${id}">${name}</a>`);
}

  h += `<h3 class="sec">全部算法</h3>`;
  FAMILIES.filter((f) => f.id !== "appendix").forEach((f) => {
    h += `<h4 class="sec">${esc(f.name)} · <span style="font-weight:400">${esc(f.desc)}</span></h4><div class="cards">`;
    ALGOS.filter((a) => a.family === f.id).forEach((a) => {
      h += `<a class="card" href="${hashOf(a.id)}">
        <div class="t">${esc(a.name)}</div>
        <div class="d">${esc(a.tagline)}</div>
        <div class="m">${esc(a.cx)}</div></a>`;
    });
    h += `</div>`;
  });

  return h;
}

/* ================= 判定与选型页 ================= */
function renderConcepts() {
  let h = `<div class="page-head"><h2>判定与选型</h2>
    <p class="sub">先判断「有没有性质」，再判断「访问模型」——这两步做完，该用哪个算法基本就唯一确定了。</p></div>`;

  h += `<h3 class="sec">性质层级（强 → 弱）</h3>`;
  h += `<div class="table-wrap"><table class="grid"><thead><tr>
    <th style="min-width:190px">性质</th><th>定义</th></tr></thead><tbody>`;
  CONCEPTS.chain.forEach((c) => {
    h += `<tr><td class="name">${esc(strip(c.t))}</td><td>${c.d}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<div class="callout ok"><code>Monge ⟹ TM ⟹ Monotone</code>，逆向都不成立。
    TM 的严格定义：任意 2×2 子矩阵（行、列都<b>不必连续</b>）都是单调的；等价于不存在这样的 2×2——它的行最小值落在右上角和左下角。</div>`;

  h += `<h3 class="sec">如何验证性质</h3><ul class="list">`;
  CONCEPTS.verify.forEach((v) => { h += `<li>${v}</li>`; });
  h += `</ul>`;

  h += `<h3 class="sec">访问模型：最关键的一步</h3>`;
  h += `<div class="table-wrap"><table class="grid"><thead><tr>
    <th style="min-width:110px">模型</th><th style="min-width:260px">含义</th><th>可用算法</th></tr></thead><tbody>`;
  CONCEPTS.accessModels.forEach((m) => {
    h += `<tr><td class="name">${esc(strip(m.t))}</td><td>${m.d}</td><td>${esc(strip(m.ok))}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<div class="callout warn"><b>最容易踩的坑：</b>看到「决策单调」就套 SMAWK，结果成本函数只能靠双指针维护（移动访问），
    或者 dp 存在链式依赖（在线）。这两种情况下 SMAWK 直接不成立，应分别退回
    <a href="#/algo/dc-optimization">D&C 分治 + 莫队</a> 与 <a href="#/algo/cdq-smawk">CDQ 分治 + 矩阵搜索</a>。</div>`;

  h += `<h3 class="sec">选型决策树</h3>`;
  h += `<pre class="tree"><code>${treeHTML(DECISION_TREE)}</code></pre>`;

  h += `<h3 class="sec">常见误区</h3><ul class="list">`;
  CONCEPTS.myths.forEach((m) => { h += `<li>${m}</li>`; });
  h += `</ul>`;

  return h;
}

/* ================= 算法页 ================= */
function renderAlgo(a) {
  let h = `<div class="page-head">
    <h2>${esc(a.name)}</h2>
    <p class="sub">${a.tagline}</p>
    <p class="en">${esc(a.en)}</p>
  </div>`;

  h += `<div class="badges">`;
  h += `<span class="badge cx">${esc(a.cx)}</span>`;
  a.props.forEach((p) => { h += `<span class="badge">${p}</span>`; });
  a.access.forEach((x) => { h += `<span class="badge ${x === "移动访问" ? "moving" : ""}">${x}</span>`; });
  h += `<span class="badge ${a.mode && a.mode.indexOf("在线") >= 0 ? "online" : "offline"}">${esc(a.mode)}</span>`;
  if (/随机化|期望/.test(a.cx + a.cxNote)) h += `<span class="badge rand">随机化</span>`;
  h += `</div>`;

  if (a.cxNote) h += `<div class="callout"><b>复杂度说明：</b>${a.cxNote}</div>`;

  if (a.cxTable && a.cxTable.length) {
    h += `<h3 class="sec">复杂度细分</h3><div class="table-wrap"><table class="grid"><thead><tr>
      <th style="min-width:220px">情形</th><th style="min-width:200px">复杂度</th></tr></thead><tbody>`;
    a.cxTable.forEach((r) => {
      h += `<tr><td>${r.c}</td><td><span class="cx-cell">${esc(r.v)}</span></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }

  h += `<h3 class="sec">适用场景</h3><ul class="list">`;
  a.when.forEach((w) => { h += `<li>${w}</li>`; });
  h += `</ul>`;

  h += `<h3 class="sec">原理与步骤</h3><ol class="list">`;
  a.how.forEach((s) => { h += `<li>${s}</li>`; });
  h += `</ol>`;

  if (a.code) {
    h += `<h3 class="sec">代码骨架</h3><pre><code>${hl(a.code)}</code></pre>`;
  }

  h += `<h3 class="sec">坑点</h3><ul class="list">`;
  a.pitfalls.forEach((p) => { h += `<li>${p}</li>`; });
  h += `</ul>`;

  h += `<h3 class="sec">经典题</h3><ul class="list">`;
  a.problems.forEach((p) => { h += `<li>${p}</li>`; });
  h += `</ul>`;

  if (a.refs && a.refs.length) {
    h += `<h3 class="sec">参考</h3>`;
    a.refs.forEach((r) => {
      h += `<div class="ref-item"><span class="rt">${esc(r.t)}</span>
        <span class="rd"> — ${esc(r.d)}</span><br><a href="${r.u}" target="_blank" rel="noopener">${esc(r.u)}</a></div>`;
    });
  }

  return h;
}

/* ================= 资料页 ================= */
function renderResources() {
  let h = `<div class="page-head"><h2>资料</h2>
    <p class="sub">讲义、模板库、原始论文与配套题单。链接均为公开可访问的资源。</p></div>`;

  RESOURCES.forEach((g) => {
    h += `<h3 class="sec">${esc(g.cat)}</h3>`;
    g.items.forEach((it) => {
      h += `<div class="ref-item"><span class="rt">${esc(it.t)}</span>
        <span class="rd"> — ${esc(it.d)}</span><br><a href="${it.u}" target="_blank" rel="noopener">${esc(it.u)}</a></div>`;
    });
  });

  h += `<h3 class="sec">建议的学习顺序</h3><ol class="list">
    <li>先吃透 <a href="#/algo/dc-optimization">D&C Optimization</a> 与 <a href="#/algo/monotone-minima">Monotone Minima</a>——它们是整个族的入口，代码短、直觉强。</li>
    <li>再学 <a href="#/algo/binary-stack">二分栈</a>：理解「在线」与「离线」的分野，这是本族最容易被忽略的一条轴。</li>
    <li>然后读 <a href="#/concepts">判定与选型</a>，把 Monge / TM / 访问模型三者的关系理清。</li>
    <li>需要时再上 <a href="#/algo/smawk">SMAWK</a> 与 <a href="#/algo/simplified-larsch">Simplified LARSCH</a>——这两个覆盖了剩下的绝大多数场景。</li>
    <li><a href="#/algo/aliens-trick">Aliens Trick</a> 与 <a href="#/algo/slope-trick">Slope Trick</a> 是另一条独立的轴（凸性），建议单独练。</li>
    <li>线性的 <a href="#/algo/larsch">LARSCH</a> / Wilber / Galil–Park 留到最后：理论价值高，竞赛性价比低。</li>
  </ol>`;

  h += `<div class="footer-note">本页为学习导航，复杂度与适用条件以各算法的原始论文与官方题解为准；
    竞赛中建议优先使用经过验证的模板库实现。</div>`;
  return h;
}

/* ================= 路由 ================= */
function pagerFor(page) {
  const i = PAGES.indexOf(page);
  if (i < 0) return "";
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  const label = (p) => pageTitle[p] || (byId(p) ? byId(p).name : p);
  let h = `<div class="pager">`;
  h += prev ? `<a href="${hashOf(prev)}"><span class="lb">← 上一个</span>${esc(label(prev))}</a>` : `<span></span>`;
  h += next ? `<a href="${hashOf(next)}" style="text-align:right;margin-left:auto"><span class="lb">下一个 →</span>${esc(label(next))}</a>` : `<span></span>`;
  h += `</div>`;
  return h;
}

function render() {
  const page = (location.hash.replace(/^#\/?/, "") || "overview").split("/")[0];
  let html = "";

  if (page === "overview") html = renderOverview();
  else if (page === "concepts") html = renderConcepts();
  else if (page === "resources") html = renderResources();
  else {
    const a = byId(page);
    html = a ? renderAlgo(a)
      : `<div class="page-head"><h2>页面不存在</h2><p class="sub"><a href="#/overview">返回总览</a></p></div>`;
  }

  html += pagerFor(page);
  const c = document.getElementById("content");
  c.innerHTML = html;
  markActive(page);

  const crumb = document.getElementById("crumb");
  if (page === "overview") crumb.innerHTML = "<b>总览</b>";
  else if (page === "concepts") crumb.innerHTML = "<b>判定与选型</b>";
  else if (page === "resources") crumb.innerHTML = "<b>资料</b>";
  else {
    const a = byId(page);
    const fam = a ? FAMILIES.find((f) => f.id === a.family) : null;
    crumb.innerHTML = `${fam ? esc(fam.name.split("·").slice(1).join("·").trim()) : ""} / <b>${esc(a ? a.name : page)}</b>`;
  }

  // 族筛选
  document.querySelectorAll("#famChips .chip").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll("#famChips .chip").forEach((b) => b.classList.remove("on"));
      btn.classList.add("on");
      const fam = btn.dataset.fam;
      document.querySelectorAll("table.grid tr").forEach((tr) => {
        const f = tr.dataset.fam;
        if (!f) return;
        tr.style.display = (fam === "all" || f === fam) ? "" : "none";
      });
      document.querySelectorAll("table.grid tr.group-row").forEach((tr) => {
        tr.style.display = (fam === "all") ? "" : (tr.dataset.fam === fam ? "" : "none");
      });
    };
  });

  window.scrollTo(0, 0);
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim").classList.remove("show");
}

/* ================= 启动 ================= */
/* file:// 下部分浏览器禁用 localStorage，做安全包装避免脚本中断 */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};

function initTheme() {
  const saved = store.get("dpopt-theme");
  const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeBtn").textContent = theme === "dark" ? "☀" : "☾";
}

document.addEventListener("DOMContentLoaded", () => {
  initTheme();
  renderSidebar();
  render();

  window.addEventListener("hashchange", render);

  document.getElementById("search").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderSidebar();
    markActive((location.hash.replace(/^#\/?/, "") || "overview").split("/")[0]);
    if ((location.hash.replace(/^#\/?/, "") || "overview").split("/")[0] === "overview") render();
  });

  document.getElementById("themeBtn").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const nx = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx);
    store.set("dpopt-theme", nx);
    document.getElementById("themeBtn").textContent = nx === "dark" ? "☀" : "☾";
  };

  document.getElementById("menuBtn").onclick = () => {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("scrim").classList.toggle("show");
  };
  document.getElementById("scrim").onclick = () => {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
  };
});

</script>
</body>
</html>
